name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated here so the repo only holds our own code.
      - name: Generate Android project
        run: flutter create --platforms=android --org dz.mizanpro --project-name mizan_pro .

      - name: Remove default test and set app name
        run: |
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="الميزان برو"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mizan-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
